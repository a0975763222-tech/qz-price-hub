                                    ) : (
                                    <div className="flex flex-col items-center gap-1 opacity-20 group-hover:opacity-40 transition-opacity">
                                        <ChevronRightIcon size={24} className="text-slate-500 rotate-90 lg:rotate-90"/>
                                        <span className="text-[10px] font-black text-slate-600 uppercase tracking-widest">同一機型系列</span>
                                    </div>
                                    )}
                                </div>

                                {/* 容量 */}
                                <div className="w-full lg:col-span-1 text-center">
                                    <span className="bg-slate-800 text-slate-200 px-6 py-2 lg:px-4 rounded-xl font-black text-[clamp(1rem,2vw,1.25rem)] border border-slate-700 shadow-inner group-hover:bg-slate-700 transition-colors inline-block w-full lg:w-auto">
                                        {v.cap}
                                    </span>
                                </div>
                                
                                {/* 市場行情 */}
                                <div className="w-full lg:col-span-2 flex flex-row lg:flex-col items-center justify-center gap-2 lg:gap-1 lg:border-x border-white/5 px-0 lg:px-4">
                                    <div className="flex-1 lg:w-full flex flex-col lg:flex-row justify-between items-center py-1.5 lg:py-0.5 px-2 lg:px-3 hover:bg-red-500/5 rounded transition-colors bg-black/20 lg:bg-transparent">
                                        <span className="text-[10px] lg:text-[9px] text-red-500/60 font-black">地標</span>
                                        <p className="text-lg lg:text-xl font-mono font-black text-red-500 leading-none">${v.landmark.toLocaleString()}</p>
                                    </div>
                                    <div className="flex-1 lg:w-full flex flex-col lg:flex-row justify-between items-center py-1.5 lg:py-0.5 px-2 lg:px-3 hover:bg-emerald-500/5 rounded transition-colors bg-black/20 lg:bg-transparent">
                                        <span className="text-[10px] lg:text-[9px] text-emerald-500/60 font-black">傑昇</span>
                                        <p className="text-lg lg:text-xl font-mono font-bold text-emerald-500 leading-none">${v.jasons.toLocaleString()}</p>
                                    </div>
                                    <div className="flex-1 lg:w-full flex flex-col lg:flex-row justify-between items-center py-1.5 lg:py-0.5 px-2 lg:px-3 lg:border-t border-white/5 lg:mt-1 lg:pt-1 hover:bg-orange-500/5 rounded transition-colors bg-black/20 lg:bg-transparent">
                                        <span className="text-[10px] lg:text-[9px] text-orange-500/60 font-black">手機王</span>
                                        <p className="text-lg lg:text-xl font-mono font-bold text-orange-500 leading-none">${v.sogi.toLocaleString()}</p>
                                    </div>
                                </div>

                                {/* 銓展售價 */}
                                <div className="w-full lg:col-span-4 text-center bg-blue-600/5 py-6 lg:py-8 rounded-2xl border border-blue-500/20 shadow-xl lg:mx-4 transform group-hover:scale-105 transition-transform duration-300 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-1 opacity-5"><ZapIcon size={24}/></div>
                                    <p className="text-[clamp(2.25rem,4vw,3rem)] font-mono font-black text-white leading-none tracking-tighter drop-shadow-[0_0_10px_rgba(255,255,255,0.2)] group-hover:text-emerald-400 transition-colors">
                                        ${chuanPrice.toLocaleString()}
                                    </p>
                                </div>

                                {/* 單機型微調控制 */}
                                <div className="w-full lg:col-span-2 flex flex-col lg:flex-row items-center justify-center gap-2 lg:gap-4 lg:border-l border-white/5 px-4 pt-2 lg:pt-0">
                                    <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest lg:hidden">單機型優惠微調 (暫時)</span>
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => updateIndividualOffset(m.id, idx, -100)} className="w-10 h-10 flex items-center justify-center bg-slate-800 rounded-lg text-slate-400 hover:text-white border border-white/5 active:scale-90 transition-all shadow-lg">
                                            <MinusIcon size={20}/>
                                        </button>
                                        <div className="text-center w-16">
                                            <p className={`text-xl font-mono font-black ${v.offset > 0 ? 'text-emerald-400' : v.offset < 0 ? 'text-red-400' : 'text-slate-700'}`}>
                                                {v.offset >= 0 ? '+' : ''}{(v.offset || 0).toLocaleString()}
                                            </p>
                                        </div>
                                        <button onClick={() => updateIndividualOffset(m.id, idx, 100)} className="w-10 h-10 flex items-center justify-center bg-slate-800 rounded-lg text-slate-400 hover:text-white border border-white/5 active:scale-90 transition-all shadow-lg">
                                            <PlusIcon size={20}/>
                                        </button>
                                    </div>
                                </div>

                                </div>
                            );
                            })}
                        </div>
                        ))
                    ) : (
                        <div className="h-64 flex items-center justify-center text-slate-700 font-black text-xl border-2 border-dashed border-slate-800 rounded-3xl uppercase tracking-widest">
                            目前資料庫無記錄 - 請切換品牌
                        </div>
                    )}
                    </div>
                </main>

                <footer className="py-3 bg-slate-950 border-t border-slate-900 px-4 lg:px-8 flex flex-col lg:flex-row justify-between items-center text-[9px] lg:text-[10px] font-bold text-slate-700 tracking-widest uppercase relative z-30 shadow-2xl gap-2 lg:gap-0 text-center lg:text-left">
                    <div className="flex gap-4 lg:gap-10 items-center">
                        <span className="flex items-center gap-2"><CircleIcon size={8} fill="#10b981" className="text-emerald-500"/> SYSTEM ONLINE</span>
                        <div className="h-4 w-px bg-slate-800 hidden lg:block"></div>
                        <div className="hidden lg:flex items-center gap-2 text-slate-500 font-black italic">
                            <ZapIcon size={14} className="text-blue-500"/> 旗艦視覺優化版：單機動態微調授權啟用 (Safe Mode)
                        </div>
                    </div>
                    <p>銓/昇展通信 | 桃園市龜山區中興路402號 | 03-3590858</p>
                </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
