<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>銓展通訊 - 報價控制台</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="text-white font-sans flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl">
        
        <!-- 頂部標題區 -->
        <div class="flex flex-col items-center text-center mb-10">
            <div class="bg-blue-600 p-4 rounded-3xl shadow-lg shadow-blue-900/40 mb-4 transform hover:scale-110 transition-transform">
                <!-- 閃電圖示 -->
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">報價同步控制台</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-[0.3em] mt-2 font-bold">Robot Command Center</p>
        </div>

        <!-- 狀態與控制區 -->
        <div class="space-y-6">
            <!-- 系統狀態卡片 -->
            <div class="bg-black/40 p-5 rounded-3xl border border-white/5 shadow-inner">
                <span class="text-[10px] font-black text-slate-500 uppercase block mb-2 tracking-widest text-center">System Status</span>
                <div class="flex items-center justify-center gap-3">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_12px_rgba(16,185,129,0.5)]"></div>
                    <span class="text-emerald-400 font-black text-base">機器人待命同步 (Ready)</span>
                </div>
            </div>

            <!-- 主啟動按鈕 -->
            <button onclick="triggerRobot()" class="group relative w-full bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-black py-7 rounded-[2rem] transition-all active:scale-95 shadow-2xl flex flex-col items-center justify-center gap-1 overflow-hidden border-t border-white/10">
                <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <span class="text-xl flex items-center gap-2">
                    🔄 立即手動同步報價
                </span>
                <span class="text-[10px] opacity-60 font-medium uppercase tracking-widest">Execute Sync Workflow</span>
            </button>

            <!-- 提示文字區 -->
            <div class="bg-amber-500/5 p-5 rounded-3xl border border-amber-500/10">
                <div class="flex gap-3">
                    <span class="text-amber-500 text-lg">💡</span>
                    <p class="text-[12px] text-slate-400 font-bold leading-relaxed">
                        <span class="text-amber-500">操作說明：</span><br>
                        點擊上方按鈕後，會開啟 GitHub Actions 頁面。請在該頁面右側找到 <span class="text-white px-1.5 py-0.5 bg-blue-600 rounded text-[10px]">Run workflow</span> 按鈕並點擊，機器人就會立刻起床更新全店報價。
                    </p>
                </div>
            </div>
        </div>

        <!-- 底部資訊與跳轉 -->
        <div class="mt-12 pt-8 border-t border-slate-800/50 flex flex-col items-center gap-4 px-2">
            <div class="flex justify-between w-full items-center">
                <div class="text-[10px] font-black text-slate-700">銓/昇展通訊 v5.0</div>
                <a href="index.html" class="text-[10px] font-black text-blue-500 hover:text-blue-400 flex items-center gap-1 transition-colors border border-blue-500/30 px-3 py-1.5 rounded-full">
                    進入戰情室主螢幕 <span>→</span>
                </a>
            </div>
            <p class="text-[9px] text-slate-600 font-medium">系統部專用遙控介面 - 非授權人員請勿操作</p>
        </div>
    </div>

    <script>
        function triggerRobot() {
            // 指導老闆前往 GitHub Actions 的觸發網址
            // 這是您專案的 Actions 頁面網址
            const workflowUrl = 'https://github.com/a0975763222-tech/VIP-QZ/actions/workflows/robot.yml';
            window.open(workflowUrl, '_blank');
        }
    </script>
</body>
</html>
