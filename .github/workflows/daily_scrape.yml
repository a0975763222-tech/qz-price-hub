name: 銓展小幫手：每日自動報價同步on:schedule:# 每天台灣時間早上 09:30 執行 (UTC 01:30)- cron: '30 1 * * *'workflow_dispatch: # 讓老闆可以在 GitHub 頁面上點按鈕手動執行jobs:build:runs-on: ubuntu-lateststeps:
- name: 檢查程式碼
  uses: actions/checkout@v3

- name: 設定 Python 環境
  uses: actions/setup-python@v4
  with:
    python-version: '3.9'

- name: 安裝機器人必要的套件
  run: |
    python -m pip install --upgrade pip
    pip install firebase-admin requests

- name: 啟動雲端抓取機器人
  env:
    # 這裡會讀取您在 Settings 裡設好的鑰匙
    FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    APP_ID: ${{ secrets.APP_ID }}
  run: python iphone17_scraper.py
