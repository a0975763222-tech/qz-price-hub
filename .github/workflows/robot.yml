name: 銓展通訊自動報價排程 (Playwright 增強版)

on:
  schedule:
    # 每天早上 9:30 執行一次 (UTC 時間 1:30)
    - cron: '30 1 * * *'
  workflow_dispatch: # 保留老闆專屬的手動按鈕觸發功能

permissions:
  contents: write # 允許機器人覆寫 prices.json

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
    - name: 取得最新程式碼 (Checkout)
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📥 安裝 Playwright 與瀏覽器驅動 (老闆指定修正)
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium

    - name: 🚀 執行報價爬蟲大腦 (robot_sync.py)
      run: |
        python robot_sync.py

    - name: 💾 儲存並推送最新報價至戰情中心
      run: |
        git config --global user.name "QZ-Bot"
        git config --global user.email "bot@quanzhan.com"
        git add prices.json
        # 如果價格沒變就不強行提交，避免報錯退出
        git commit -m "🤖 自動更新最新報價：$(date +'%Y-%m-%d %H:%M:%S')" || exit 0
        git push
