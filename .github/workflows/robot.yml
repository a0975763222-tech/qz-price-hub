name: 銓展報價同步機器人

on:
  schedule:
    # 每天台灣時間早上 09:30 自動執行 (UTC 01:30)
    - cron: '30 1 * * *'
  workflow_dispatch: # 允許老闆手動點擊執行

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    # 給予機器人寫入權限，否則它無法更新 prices.json
    permissions:
      contents: write
      
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 執行報價更新腳本
        run: python robot_sync.py

      - name: 提交並推送更新後的 prices.json
        run: |
          git config --global user.name "QZ-Bot"
          git config --global user.email "bot@qz-tech.com"
          git add prices.json
          # 如果檔案沒變動就不提交，避免報錯
          git commit -m "🤖 機器人自動同步最新報價 [$(date '+%Y-%m-%d %H:%M')]" || exit 0
          git push
